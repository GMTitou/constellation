<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorpio (Scorpion)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ouma+Latin:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<!-- ⭐ Fond étoilé (apparaît uniquement quand la constellation est réussie) -->
<div id="stars-container"></div>

<main class="page">
    <!-- ===== TITRE CENTRÉ ===== -->
    <h1 class="constellation-title">Scorpio</h1>

    <!-- ===== POPUP (contenu 100% HTML) ===== -->
    <div
            id="popup"
            class="popup"
            role="status"
            aria-live="polite"
            data-info-text="Le Scorpion est une constellation du zodiaque reconnaissable par sa longue chaîne d'étoiles formant une courbe, représentant le corps et la queue du scorpion. Relie les étoiles dans l'ordre pour reconstruire sa silhouette sinueuse."
            data-success-text="Bravo ! Tu as correctement relié toutes les étoiles de la constellation du Scorpion. Sa forme allongée est l'une des plus caractéristiques du ciel nocturne."
            data-answer-text="Le tracé officiel de la constellation du Scorpion est affiché. Compare-le avec ton dessin et observe la courbure de sa queue."
    >
        <div class="row">
            <div style="flex:1">
                <div class="text" id="popupText">...</div>
            </div>
            <button
                    class="close"
                    id="popupClose"
                    type="button"
                    aria-label="Fermer"
            >
                ✕
            </button>
        </div>
    </div>

    <!-- ===== NAVIGATION LATÉRALE + BOARD ===== -->
    <div class="board-container">
        <!-- Flèche Précédent -->
        <a href="07-libra.html" class="arrow-nav arrow-prev" aria-label="Constellation précédente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>

        <!-- Zone de jeu -->
        <div class="board" data-mode="free">
            <svg
                    class="overlay"
                    viewBox="0 0 1000 1000"
                    preserveAspectRatio="none"
            >
                <path id="playerPath"></path>
                <path id="constellationPath" class="answer" opacity="0"></path>
            </svg>

            <!-- ⭐ ÉTOILES — SCORPIO -->
            <button class="dot" data-n="1" style="left:73%; top:10%;"></button>
            <button class="dot" data-n="2" style="left:63%; top:23%;"></button>
            <button class="dot" data-n="3" style="left:68%; top:21.5%;"></button>
            <button class="dot" data-n="4" style="left:80%; top:19.5%;"></button>
            <button class="dot" data-n="7" style="left:80%; top:28%;"></button>
            <button class="dot" data-n="9" style="left:57%; top:30%;"></button>
            <button class="dot" data-n="10" style="left:44%; top:55%;"></button>
            <button class="dot" data-n="11" style="left:42%; top:62%;"></button>
            <button class="dot" data-n="12" style="left:27%; top:59.5%;"></button>
            <button class="dot" data-n="13" style="left:23%; top:58.7%;"></button>
            <button class="dot" data-n="14" style="left:18%; top:68%;"></button>
            <button class="dot" data-n="15" style="left:17%; top:75%;"></button>
            <button class="dot" data-n="16" style="left:25%; top:83%;"></button>
            <button class="dot" data-n="17" style="left:37%; top:86%;"></button>
            <button class="dot" data-n="18" style="left:50%; top:85%;"></button>
        </div>

        <!-- Flèche Suivant -->
        <a href="09-sagittarius.html" class="arrow-nav arrow-next" aria-label="Constellation suivante">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </a>
    </div>
</main>

<!-- ===== BANNIÈRE DE NAVIGATION (FIXÉE EN BAS) ===== -->
<div class="navbar">
    <a class="nav-btn back-btn" href="../index.html">← Menu</a>

    <div class="nav-actions">
        <button id="undo" class="nav-btn" type="button">Annuler</button>
        <button id="reset" class="nav-btn" type="button">Recommencer</button>
        <button id="toggleAnswer" class="nav-btn" type="button">Afficher la constellation</button>
    </div>

    <div class="nav-placeholder"></div>
</div>

</body>
</html>
