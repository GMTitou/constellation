<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cancer (Crabe)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ouma+Latin:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
<!-- Conteneur des étoiles de fond -->
<div id="stars-container"></div>

<main class="page">
    <!-- ===== TITRE CENTRÉ ===== -->
    <h1 class="constellation-title">Cancer</h1>

    <!-- ===== POPUP (contenu 100% HTML) ===== -->
    <div
            id="popup"
            class="popup"
            role="status"
            aria-live="polite"
            data-info-text="Le Cancer est une constellation du zodiaque associée au crabe dans la mythologie. Elle est plus discrète que d'autres constellations et se compose d'étoiles relativement peu lumineuses. En reliant correctement les étoiles, tu peux reconstituer sa forme caractéristique."
            data-success-text="Bravo ! Tu as correctement relié toutes les étoiles du Cancer. Cette constellation est réputée pour être subtile et difficile à repérer dans le ciel."
            data-answer-text="Le tracé officiel de la constellation du Cancer est affiché. Observe bien sa forme et compare-la avec ton propre dessin."
    >
        <div class="row">
            <div style="flex:1">
                <div class="text" id="popupText">...</div>
            </div>
            <button
                    class="close"
                    id="popupClose"
                    type="button"
                    aria-label="Fermer"
            >
                ✕
            </button>
        </div>
    </div>

    <!-- ===== NAVIGATION LATÉRALE + BOARD ===== -->
    <div class="board-container">
        <!-- Flèche Précédent -->
        <a href="03-gemini.html" class="arrow-nav arrow-prev" aria-label="Constellation précédente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>

        <!-- Zone de jeu -->
        <div class="board" data-mode="free">
            <svg
                    class="overlay"
                    viewBox="0 0 1000 1000"
                    preserveAspectRatio="none"
            >
                <path id="playerPath"></path>
                <path id="constellationPath" class="answer" opacity="0"></path>
            </svg>

            <!-- ⭐ ÉTOILES — CANCER -->
            <button class="dot" data-n="1" style="left:41%; top:22%;"></button>
            <button class="dot" data-n="2" style="left:49%; top:43%;"></button>
            <button class="dot" data-n="3" style="left:50%; top:55%;"></button>
            <button class="dot" data-n="4" style="left:65%; top:79%;"></button>
            <button class="dot" data-n="6" style="left:37%; top:73%;"></button>
        </div>

        <!-- Flèche Suivant -->
        <a href="05-leo.html" class="arrow-nav arrow-next" aria-label="Constellation suivante">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </a>
    </div>
</main>

<!-- ===== BANNIÈRE DE NAVIGATION (FIXÉE EN BAS) ===== -->
<div class="navbar">
    <a class="nav-btn back-btn" href="../index.html">← Menu</a>

    <div class="nav-actions">
        <button id="undo" class="nav-btn" type="button">Annuler</button>
        <button id="reset" class="nav-btn" type="button">Recommencer</button>
        <button id="toggleAnswer" class="nav-btn" type="button">Afficher la constellation</button>
    </div>

    <div class="nav-placeholder"></div>
</div>

<!-- ===== CONFIG DES SEGMENTS (LOGIQUE UNIQUEMENT) ===== -->
<script>
    window.CONSTELLATION_SEGMENTS = [
        [1, 2],
        [2, 3],
        [3, 4],
        [4, 3],
        [3, 6],
    ];
</script>

<!-- ===== MOTEUR DU JEU (GÉNÉRIQUE) ===== -->
<script src="../app.js"></script>

</body>
</html>
