<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>01 — Aries</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<main class="page">
    <div class="topbar">
        <a class="back" href="../index.html">← Menu</a>
        <h1>01 — Aries (Bélier)</h1>
    </div>

    <div class="board" data-mode="free">
        <svg class="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <path id="playerPath"></path>
            <path id="constellationPath" class="answer" opacity="0"></path>
        </svg>

        <!--
            Constellation Aries en forme d'ARC (arc de tir)
            Forme : arc bien bombé + corde qui le traverse
        -->

        <!-- Extrémités de l'arc et de la corde -->
        <button class="dot" data-n="1" style="left:15%; top:5%;">1</button>
        <button class="dot" data-n="4" style="left:70%; top:20%;">4</button>

        <!-- Points de l'arc (bien bombés vers l'extérieur) -->
        <button class="dot" data-n="2" style="left:25%; top:65%;">2</button>
        <button class="dot" data-n="3" style="left:50%; top:45%;">3</button>

        <!-- La pointe de la flèche -->
        <button class="dot" data-n="5" style="left:85%; top:35%;">5</button>
    </div>

    <div class="actions">
        <button id="undo" type="button">Annuler</button>
        <button id="reset" type="button">Reset</button>
        <button id="toggleAnswer" type="button">Afficher la constellation</button>
        <a class="next" href="02-taurus.html">Suivant →</a>
    </div>
</main>

<script>
    // Forme d'ARC d'Aries (arc de tir à l'arc)
    window.CONSTELLATION_SEGMENTS = [
        // La corde (ligne droite de 1 à 4)
        [1, 4],

        // L'arc (ligne courbe : 1 → 2 → 3 → 4)
        [1, 2],
        [2, 3],
        [3, 4],

        // La pointe de la flèche
        [4, 5]
    ];
</script>

<script src="../app.js"></script>
</body>
</html>
