<body>
<!-- Conteneur des étoiles de fond -->
<div id="stars-container"></div>

<main class="page">
    <!-- ===== TITRE CENTRÉ ===== -->
    <h1 class="constellation-title">Sagittarius</h1>

    <!-- ===== POPUP (contenu 100% HTML) ===== -->
    <div
            id="popup"
            class="popup"
            role="status"
            aria-live="polite"
            data-info-text="Le Sagittaire est une constellation du zodiaque représentant un archer (centaure) avec son arc. Elle est reconnaissable par sa forme de théière ou d'arc tendu. Relie les étoiles dans l'ordre pour reconstruire sa silhouette."
            data-success-text="Bravo ! Tu as correctement relié toutes les étoiles du Sagittaire. L'archer céleste tire sa flèche vers le cœur de la Voie lactée."
            data-answer-text="Le tracé officiel de la constellation du Sagittaire est affiché. Compare-le avec ton dessin et observe la forme de l'arc tendu."
    >
        <div class="row">
            <div style="flex:1">
                <div class="text" id="popupText">...</div>
            </div>
            <button
                    class="close"
                    id="popupClose"
                    type="button"
                    aria-label="Fermer"
            >
                ✕
            </button>
        </div>
    </div>

    <!-- ===== BOARD (zone de jeu) ===== -->
    <div class="board" data-mode="free">
        <svg
                class="overlay"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
        >
            <path id="playerPath"></path>
            <path id="constellationPath" class="answer" opacity="0"></path>
        </svg>

        <!-- ⭐ ÉTOILES — SAGITTARIUS -->
        <button class="dot" data-n="1" style="left:25%; top:25%;"></button>
        <button class="dot" data-n="2" style="left:35%; top:35%;"></button>
        <button class="dot" data-n="3" style="left:45%; top:28%;"></button>
        <button class="dot" data-n="4" style="left:52%; top:35%;"></button>
        <button class="dot" data-n="5" style="left:45%; top:42%;"></button>
        <button class="dot" data-n="6" style="left:35%; top:50%;"></button>
        <button class="dot" data-n="7" style="left:28%; top:58%;"></button>
        <button class="dot" data-n="8" style="left:38%; top:65%;"></button>
        <button class="dot" data-n="9" style="left:60%; top:45%;"></button>
        <button class="dot" data-n="10" style="left:68%; top:38%;"></button>
        <button class="dot" data-n="11" style="left:75%; top:32%;"></button>
    </div>
</main>
