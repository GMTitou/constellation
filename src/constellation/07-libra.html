<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Libra (Balance)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ouma+Latin:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
<!-- Conteneur des étoiles de fond -->
<div id="stars-container"></div>

<main class="page">
    <!-- ===== TITRE CENTRÉ ===== -->
    <h1 class="constellation-title">Libra</h1>

    <!-- ===== POPUP (contenu 100% HTML) ===== -->
    <div
            id="popup"
            class="popup"
            role="status"
            aria-live="polite"
            data-info-text="La Balance est une constellation du zodiaque symbolisant l'équilibre et la justice. Elle est reconnaissable par une forme relativement simple, évoquant deux plateaux reliés par une barre centrale. Relie les étoiles dans l'ordre pour reconstruire la constellation de la Balance."
            data-success-text="Bravo ! Tu as correctement relié toutes les étoiles de la constellation de la Balance. Son tracé symétrique demande précision et observation."
            data-answer-text="Le tracé officiel de la constellation de la Balance est affiché. Compare-le avec ton dessin et observe son équilibre."
    >
        <div class="row">
            <div style="flex:1">
                <div class="text" id="popupText">...</div>
            </div>
            <button
                    class="close"
                    id="popupClose"
                    type="button"
                    aria-label="Fermer"
            >
                ✕
            </button>
        </div>
    </div>

    <!-- ===== BOARD (zone de jeu) ===== -->
    <div class="board" data-mode="free">
        <svg
                class="overlay"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
        >
            <path id="playerPath"></path>
            <path id="constellationPath" class="answer" opacity="0"></path>
        </svg>

        <!-- ⭐ ÉTOILES — LIBRA -->
        <button class="dot" data-n="1" style="left:60%; top:20%;"></button>
        <button class="dot" data-n="2" style="left:68%; top:40%;"></button>
        <button class="dot" data-n="3" style="left:65%; top:60%;"></button>
        <button class="dot" data-n="4" style="left:50%; top:70%;"></button>
        <button class="dot" data-n="5" style="left:47%; top:38%;"></button>
        <button class="dot" data-n="6" style="left:32%; top:43%;"></button>
    </div>
</main>

<!-- ===== BANNIÈRE DE NAVIGATION (FIXÉE EN BAS) ===== -->
<div class="navbar">
    <a class="nav-btn back-btn" href="../index.html">← Menu</a>

    <div class="nav-actions">
        <button id="undo" class="nav-btn" type="button">Annuler</button>
        <button id="reset" class="nav-btn" type="button">Recommencer</button>
        <button id="toggleAnswer" class="nav-btn" type="button">Afficher la constellation</button>
    </div>

    <a class="nav-btn next-btn" href="08-scorpio.html">Suivant →</a>
</div>

<!-- ===== CONFIG DES SEGMENTS — LIBRA ===== -->
<script>
    window.CONSTELLATION_SEGMENTS = [
        [1, 2],
        [1, 3],
        [1, 4],
        [1, 5],
        [5, 6]
    ];
</script>

<!-- ===== MOTEUR DU JEU (GÉNÉRIQUE) ===== -->
<script src="../app.js"></script>

</body>
</html>
