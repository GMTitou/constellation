<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pisces (Poissons)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ouma+Latin:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
<!-- Conteneur des étoiles de fond -->
<div id="stars-container"></div>

<main class="page">
    <!-- ===== TITRE CENTRÉ ===== -->
    <h1 class="constellation-title">Pisces</h1>

    <!-- ===== POPUP (contenu 100% HTML) ===== -->
    <div
            id="popup"
            class="popup"
            role="status"
            aria-live="polite"
            data-info-text="Les Poissons sont une constellation du zodiaque représentant deux poissons reliés par une corde. Les étoiles forment un V caractéristique symbolisant les deux poissons nageant en directions opposées. Relie les étoiles dans l'ordre pour reconstruire leur forme."
            data-success-text="Bravo ! Tu as correctement relié toutes les étoiles des Poissons. Cette constellation clôture le cycle du zodiaque avec deux poissons éternellement liés."
            data-answer-text="Le tracé officiel de la constellation des Poissons est affiché. Compare-le avec ton dessin et observe les deux poissons reliés par leur corde."
    >
        <div class="row">
            <div style="flex:1">
                <div class="text" id="popupText">...</div>
            </div>
            <button
                    class="close"
                    id="popupClose"
                    type="button"
                    aria-label="Fermer"
            >
                ✕
            </button>
        </div>
    </div>

    <!-- ===== NAVIGATION LATÉRALE + BOARD ===== -->
    <div class="board-container">
        <!-- Flèche Précédent -->
        <a href="11-aquarius.html" class="arrow-nav arrow-prev" aria-label="Constellation précédente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>

        <!-- Zone de jeu -->
        <div class="board" data-mode="free">
            <svg
                    class="overlay"
                    viewBox="0 0 1000 1000"
                    preserveAspectRatio="none"
            >
                <path id="playerPath"></path>
                <path id="constellationPath" class="answer" opacity="0"></path>
            </svg>

            <!-- ⭐ ÉTOILES — PISCES -->
            <button class="dot" data-n="1" style="left:45%; top:5%;"></button>
            <button class="dot" data-n="2" style="left:40%; top:12%;"></button>
            <button class="dot" data-n="3" style="left:28%; top:13%;"></button>
            <button class="dot" data-n="4" style="left:28%; top:23%;"></button>
            <button class="dot" data-n="5" style="left:25%; top:33%;"></button>
            <button class="dot" data-n="6" style="left:23%; top:50%;"></button>
            <button class="dot" data-n="7" style="left:26%; top:48%;"></button>
            <button class="dot" data-n="8" style="left:30%; top:44%;"></button>
            <button class="dot" data-n="9" style="left:38%; top:40%;"></button>
            <button class="dot" data-n="10" style="left:46%; top:42.5%;"></button>
            <button class="dot" data-n="11" style="left:56%; top:44%;"></button>
            <button class="dot" data-n="12" style="left:62%; top:46%;"></button>
            <button class="dot" data-n="13" style="left:68%; top:42%;"></button>
            <button class="dot" data-n="14" style="left:74%; top:50%;"></button>
            <button class="dot" data-n="15" style="left:80%; top:47%;"></button>
            <button class="dot" data-n="17" style="left:70%; top:57%;"></button>
            <button class="dot" data-n="18" style="left:64%; top:56%;"></button>
        </div>

        <!-- Flèche Suivant (retour au Menu) -->
        <a href="../index.html" class="arrow-nav arrow-next" aria-label="Retour au menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </a>
    </div>
</main>

<!-- ===== BANNIÈRE DE NAVIGATION (FIXÉE EN BAS) ===== -->
<div class="navbar">
    <a class="nav-btn back-btn" href="../index.html">← Menu</a>

    <div class="nav-actions">
        <button id="undo" class="nav-btn" type="button">Annuler</button>
        <button id="reset" class="nav-btn" type="button">Recommencer</button>
        <button id="toggleAnswer" class="nav-btn" type="button">Afficher la constellation</button>
    </div>

    <div class="nav-placeholder"></div>
</div>
