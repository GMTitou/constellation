<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Constellations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ouma+Latin:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="stars-container"></div>

<main class="page">
    <!-- Section Hero : Titre et sous-titre centrés -->
    <section class="hero-section" id="heroSection">
        <div class="hero-content">
            <h1 class="title">Constellations</h1>
            <p class="sub-title">A vous de relier les étoiles pour découvrir les constellations qui s'y cachent.</p>
        </div>
    </section>

    <!-- Section Liens : apparaît au scroll -->
    <section class="links-section" id="linksSection">
        <div class="links">
            <h2 class="nvx">Niveaux</h2>
            <a class="link-name" href="constellation/01-aries.html">Aries</a>
            <a class="link-name" href="constellation/02-taurus.html">Taurus</a>
            <a class="link-name" href="constellation/03-gemini.html">Gemini</a>
            <a class="link-name" href="constellation/04-cancer.html">Cancer</a>
            <a class="link-name" href="constellation/05-leo.html">Leo</a>
            <a class="link-name" href="constellation/06-virgo.html">Virgo</a>
            <a class="link-name" href="constellation/07-libra.html">Libra</a>
            <a class="link-name" href="constellation/08-scorpio.html">Scorpio</a>
            <a class="link-name" href="constellation/09-sagittarius.html">Sagittarius</a>
            <a class="link-name" href="constellation/10-capricorn.html">Capricorn</a>
            <a class="link-name" href="constellation/11-aquarius.html">Aquarius</a>
            <a class="link-name" href="constellation/12-pisces.html">Pisces</a>
        </div>
    </section>
</main>

<!-- Script 1 : Étoiles de fond -->
<script>
    const starsContainer = document.getElementById('stars-container');
    const starCount = 200;

    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'bg-star';

        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const size = Math.random() * 2 + 1;
        const opacity = Math.random() * 0.7 + 0.2;
        const twinkleDuration = Math.random() * 4 + 2;
        const twinkleDelay = Math.random() * 3;
        const moveDuration = Math.random() * 20 + 15;
        const moveDelay = Math.random() * 4;

        star.style.cssText = `
            left: ${x}%;
            top: ${y}%;
            width: ${size}px;
            height: ${size}px;
            opacity: ${opacity};
            animation:
                twinkle ${twinkleDuration}s ease-in-out ${twinkleDelay}s infinite,
                float ${moveDuration}s ease-in-out ${moveDelay}s infinite;
        `;

        starsContainer.appendChild(star);
    }

    starsContainer.classList.add('show');
</script>

<!-- Script 2 : Effet de scroll -->
<script>
    const heroSection = document.getElementById('heroSection');
    const linksSection = document.getElementById('linksSection');

    window.addEventListener('scroll', () => {
        const scrollPosition = window.scrollY;
        const windowHeight = window.innerHeight;

        // Calcul de l'opacité du hero (disparaît progressivement)
        const heroOpacity = Math.max(0, 1 - (scrollPosition / (windowHeight * 0.5)));
        heroSection.style.opacity = heroOpacity;

        // Transformation du hero (monte légèrement)
        heroSection.style.transform = `translateY(-${scrollPosition * 0.5}px)`;

        // Les liens apparaissent quand on commence à scroller
        if (scrollPosition > windowHeight * 0.2) {
            linksSection.classList.add('visible');
        } else {
            linksSection.classList.remove('visible');
        }
    });
</script>
</body>
</html>
